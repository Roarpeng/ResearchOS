[project]
name = "researchos"
version = "0.1.0"
description = "Agent-first Deep Research OS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "redis>=5.2.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "langgraph>=0.2.0",
  "langgraph-checkpoint-postgres>=2.0.0",
  "langchain-core>=0.3.0",
  "mcp>=1.0.0",
  "psycopg[binary,pool]>=3.2.0",
  "qdrant-client>=1.12.0",
  "neo4j>=5.26.0",
  "minio>=7.2.0",
  "opensearch-py>=2.7.0",
  "python-multipart>=0.0.12",
  "PyJWT>=2.9.0",
  "orjson>=3.10.0",
  "structlog>=24.4.0",
  "tenacity>=9.0.0",
  "typer>=0.12.0",
  "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "httpx>=0.27.0",
]
parsers = [
  "markitdown>=0.0.3",
]
report = [
  "pypandoc>=1.14",
]

[project.scripts]
researchos-gateway = "gateway.app.main:run"
researchos-runtime = "runtime.researchos_runtime.server:run"
researchos-knowledge = "knowledge.cli:app"
researchos-mcp-hello = "tools.hello.server:main"
researchos-mcp-documents = "tools.documents.server:main"
researchos-mcp-vector = "tools.vector_store.server:main"
researchos-mcp-kg = "tools.knowledge_graph.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "gateway",
  "runtime",
  "agents",
  "tools",
  "knowledge",
  "industrial",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
# Host ROS may register broken pytest entrypoints; prefer:
#   PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -p pytest_asyncio

[tool.ruff]
line-length = 100
target-version = "py311"
